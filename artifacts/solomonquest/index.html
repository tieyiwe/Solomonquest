<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SolomonQuest">
    <title>SolomonQuest LMS</title>
    <meta name="description" content="SolomonQuest — The modern LMS for schools. Manage courses, assignments, quizzes, and real-time chat." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2733a5" />
    <link rel="canonical" href="https://solomonquest.tilogics.com" />
    <meta property="og:title" content="SolomonQuest LMS" />
    <meta property="og:description" content="The modern LMS for schools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SolomonQuest LMS" />
    <meta name="twitter:description" content="SolomonQuest — The modern LMS for schools. Manage courses, assignments, quizzes, and real-time chat." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved light/dark preference before first paint (see src/lib/theme.ts).
      (function () {
        try {
          var p = localStorage.getItem("sq-theme");
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0e121b");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
